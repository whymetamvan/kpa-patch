name: Extract Proto from APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-proto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L --fail \
            "https://github.com/whymetamvan/kpa-patch/releases/download/v1.132.1-1/free-fire-1-132-1.apk" \
            -o free-fire.apk

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip apktool

      - name: Extract APK
        run: |
          mkdir -p extracted
          unzip -q free-fire.apk -d extracted

      - name: Decode APK
        run: |
          apktool d free-fire.apk \
            -o decoded \
            --force

      - name: Find all .proto files
        run: |
          mkdir -p proto

          echo "Searching APK..."
          find extracted decoded \
            -type f \
            -iname "*.proto" \
            -print

          find extracted decoded \
            -type f \
            -iname "*.proto" \
            -exec cp --parents {} proto/ \;

      - name: Show extracted files
        run: |
          echo "=== PROTO FILES ==="
          find proto -type f -print || true

          echo "=== COUNT ==="
          find proto -type f | wc -l

      - name: Remove APK and temporary files
        run: |
          rm -f free-fire.apk
          rm -rf extracted decoded

      - name: Commit proto files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proto/

          if git diff --cached --quiet; then
            echo "No new .proto files found."
            exit 0
          fi

          git commit -m "Extract protobuf files from APK"
          git push
