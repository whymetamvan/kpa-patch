name: Extract Proto from APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-proto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L --fail \
            "https://github.com/whymetamvan/kpa-patch/releases/download/v1.132.1-1/free-fire-1-132-1.apk" \
            -o free-fire.apk

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Decode APK
        run: |
          apktool d free-fire.apk -o decoded --force

      - name: Extract files
        run: |
          mkdir -p proto
          # Mencari file .proto dan menyalinnya ke folder proto tanpa merusak struktur dasar
          find decoded -type f -iname "*.proto" -exec cp {} proto/ \;

      - name: Show extracted files
        run: |
          echo "=== HASIL EKSTRAKSI ==="
          ls -la proto/
          echo "Jumlah file: $(find proto -type f | wc -l)"

      - name: Clean temporary files
        run: |
          rm -f free-fire.apk
          rm -rf decoded

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proto/

          if git diff --cached --quiet; then
            echo "Tidak ada file .proto baru yang ditemukan."
            exit 0
          fi

          git commit -m "Extract proto files from APK"
          git push
