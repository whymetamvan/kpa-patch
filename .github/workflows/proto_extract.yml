name: Extract Proto from APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-proto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK
        run: |
          curl -L --fail \
            "https://github.com/whymetamvan/kpa-patch/releases/download/v1.132.1-1/free-fire-1-132-1.apk" \
            -o free-fire.apk

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip tzdata

      - name: Decode APK
        run: |
          apktool d free-fire.apk -o decoded --force

      - name: Set Folder Name with Timestamp and Extract Files
        run: |
          # Mengatur zona waktu ke Asia/Jakarta (WIB)
          export TZ="Asia/Jakarta"
          
          # Format nama folder: "PROTO DD-MM-YYYY HH.MM"
          FOLDER_NAME="PROTO $(date +'%d-%m-%Y %H.%M')"
          
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
          mkdir -p "$FOLDER_NAME"

          # Mencari file .proto dan menyalinnya ke folder berstempel waktu
          find decoded -type f -iname "*.proto" -exec cp {} "$FOLDER_NAME/" \;

      - name: Create ZIP archive
        run: |
          if [ -n "$(ls -A "$FOLDER_NAME" 2>/dev/null)" ]; then
            zip -r "${FOLDER_NAME}.zip" "$FOLDER_NAME"
            echo "Berhasil membuat ${FOLDER_NAME}.zip"
          else
            echo "Folder $FOLDER_NAME kosong, ZIP tidak dibuat."
          fi

      - name: Show extracted files
        run: |
          echo "=== HASIL EKSTRAKSI ==="
          ls -la "$FOLDER_NAME/" || true
          echo "Jumlah file: $(find "$FOLDER_NAME" -type f 2>/dev/null | wc -l)"
          ls -la "${FOLDER_NAME}.zip" || true

      - name: Clean temporary files
        run: |
          rm -f free-fire.apk
          rm -rf decoded

      - name: Commit and push files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Menambahkan folder dinamis dan file zip ke git
          git add "$FOLDER_NAME/"
          [ -f "${FOLDER_NAME}.zip" ] && git add "${FOLDER_NAME}.zip"

          if git diff --cached --quiet; then
            echo "Tidak ada file baru untuk di-commit."
            exit 0
          fi

          git commit -m "Extract proto files to '$FOLDER_NAME'"
          git push
