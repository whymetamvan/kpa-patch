name: Inspect APK Structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip file tree

      # ============================================
      # STEP 1: Download XAPK via apkeep (bukan wget!)
      # ============================================
      - name: Download XAPK with apkeep
        run: |
          mkdir -p work && cd work
          wget -q https://github.com/EFForg/apkeep/releases/download/0.16.0/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          ./apkeep -a com.tokyoghoulsea1.google -d apk-pure ./
          ls -lh *.xapk *.apk 2>/dev/null || true

          # Rename ke nama standar
          if [ -f "com.tokyoghoulsea1.google.xapk" ]; then
            mv com.tokyoghoulsea1.google.xapk tokyo_ghoul.xapk
          elif [ -f "com.tokyoghoulsea1.google.apk" ]; then
            mv com.tokyoghoulsea1.google.apk tokyo_ghoul.xapk
          fi
          ls -lh tokyo_ghoul.xapk
          file tokyo_ghoul.xapk

      # ============================================
      # STEP 2: Extract XAPK
      # ============================================
      - name: Extract XAPK
        run: |
          cd work
          mkdir -p extracted
          unzip -o tokyo_ghoul.xapk -d extracted > /dev/null 2>&1 || true
          echo "=== Root of XAPK ==="
          ls -lh extracted/

      # ============================================
      # STEP 3: Extract nested APKs
      # ============================================
      - name: Extract nested APKs
        run: |
          cd work
          mkdir -p all_apks
          find extracted -name "*.apk" -type f | while read apk; do
            name=$(basename "$apk" .apk)
            mkdir -p "all_apks/$name"
            unzip -o "$apk" -d "all_apks/$name" > /dev/null 2>&1 || true
            echo "Extracted: $apk"
          done
          echo "=== Isi all_apks ==="
          ls -lh all_apks/

      # ============================================
      # STEP 4: Generate inspection report
      # ============================================
      - name: Generate inspection report
        run: |
          cd work
          REPORT="inspection_report.txt"
          {
            echo "======================================================"
            echo "  APK INSPECTION REPORT"
            echo "  Package: com.tokyoghoulsea1.google"
            echo "  Date: $(date -u)"
            echo "======================================================"
            echo ""

            echo "### 1. ROOT OF XAPK ###"
            ls -lh extracted/ 2>/dev/null
            echo ""

            echo "### 2. NESTED APKs ###"
            find extracted -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null
            echo ""

            echo "### 3. NATIVE LIBS (.so files) ###"
            echo "--- Semua file .so di lib/ ---"
            find all_apks -path "*/lib/*" -name "*.so" -type f 2>/dev/null | while read f; do
              echo "  $(basename $f)  [$(du -h $f | cut -f1)]"
            done
            echo ""

            echo "--- Folder ABI ---"
            find all_apks -type d \( -name "arm64-v8a" -o -name "armeabi-v7a" -o -name "x86_64" \) 2>/dev/null
            echo ""

            echo "### 4. ENGINE DETECTION ###"
            if find all_apks -name "libil2cpp.so" | grep -q .; then
              echo "✅ UNITY IL2CPP (libil2cpp.so ditemukan)"
            fi
            if find all_apks -name "libunity.so" | grep -q .; then
              echo "✅ UNITY (libunity.so ditemukan)"
            fi
            if find all_apks -name "libmonobdwgc-2.0.so" -o -name "libmono.so" 2>/dev/null | grep -q .; then
              echo "✅ UNITY MONO (libmono.so ditemukan)"
            fi
            if find all_apks -name "libUE4.so" -o -name "libUnreal.so" 2>/dev/null | grep -q .; then
              echo "🎮 UNREAL ENGINE"
            fi
            if find all_apks -name "libcocos2d*.so" | grep -q .; then
              echo "🎮 COCOS2D-X"
            fi
            if find all_apks -name "libflutter.so" | grep -q .; then
              echo "📱 FLUTTER"
            fi
            if find all_apks -name "libhermes.so" -o -name "libreactnative*.so" 2>/dev/null | grep -q .; then
              echo "📱 REACT NATIVE"
            fi
            echo ""

            echo "### 5. UNITY MANAGED ASSEMBLIES ###"
            find all_apks -path "*Managed*" -name "*.dll" -type f 2>/dev/null | while read f; do
              echo "  $(basename $f)  [$(du -h $f | cut -f1)]"
            done
            echo ""

            echo "### 6. IL2CPP METADATA ###"
            find all_apks -name "global-metadata.dat" -type f 2>/dev/null | while read f; do
              echo "  FOUND: $f  [$(du -h $f | cut -f1)]"
            done
            echo ""

            echo "### 7. ASSETS ROOT ###"
            find all_apks -type d -name "assets" 2>/dev/null | while read d; do
              echo "--- $d ---"
              ls -lh "$d" | head -30
              echo ""
            done
            echo ""

            echo "### 8. KESIMPULAN ###"
            if find all_apks -name "Assembly-CSharp.dll" | grep -q .; then
              echo "🎯 UNITY MONO — paling mudah di-hook dengan BepInEx!"
            elif find all_apks -name "libil2cpp.so" | grep -q .; then
              echo "⚠️  UNITY IL2CPP — butuh Il2CppInterop untuk BepInEx."
            elif find all_apks -name "libUE4.so" | grep -q .; then
              echo "⚠️  UNREAL ENGINE — beda approach total."
            else
              echo "❓ Engine tidak terdeteksi otomatis. Cek manual."
            fi
            echo ""

            echo "### 9. TOTAL UKURAN ###"
            du -sh all_apks/
            echo ""
          } > "$REPORT"

          cat "$REPORT"

      # ============================================
      # STEP 5: Collect ONLY key files (bukan semua!)
      # ============================================
      - name: Collect key files
        run: |
          cd work
          mkdir -p key_files

          # Assembly-CSharp.dll (Unity Mono)
          find all_apks -name "Assembly-CSharp.dll" -type f -exec cp {} key_files/ \; 2>/dev/null || true
          # Semua DLL di folder Managed (kalau Mono)
          find all_apks -path "*Managed*" -name "*.dll" -type f -exec cp {} key_files/ \; 2>/dev/null || true

          # global-metadata.dat (IL2CPP)
          find all_apks -name "global-metadata.dat" -type f -exec cp {} key_files/ \; 2>/dev/null || true

          # libil2cpp.so (IL2CPP binary) - bisa 100MB+
          find all_apks -name "libil2cpp.so" -type f -exec cp {} key_files/ \; 2>/dev/null || true

          # libunity.so
          find all_apks -name "libunity.so" -type f -exec cp {} key_files/ \; 2>/dev/null || true

          # AndroidManifest.xml dari APK utama (dalam bentuk binary XML, tapi berguna)
          find all_apks -name "AndroidManifest.xml" -type f -exec cp {} key_files/ \; 2>/dev/null || true

          echo "=== File yang dikumpulkan ==="
          ls -lh key_files/
          echo ""
          echo "=== Total ukuran ==="
          du -sh key_files/

      # ============================================
      # STEP 6: Upload artifacts
      # ============================================
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: inspection-report
          path: work/inspection_report.txt
          retention-days: 30

      - name: Upload key files
        uses: actions/upload-artifact@v4
        with:
          name: key-files
          path: work/key_files/
          retention-days: 30
          if-no-files-found: warn

      # ============================================
      # STEP 7: Upload list of all .so files (teks saja, bukan binary)
      # ============================================
      - name: Generate lib listing
        run: |
          cd work
          find all_apks -path "*/lib/*" -type f > lib_listing.txt
          find all_apks -path "*Managed*" -type f >> lib_listing.txt
          find all_apks -type d -name "assets" >> lib_listing.txt
          echo "Total files: $(wc -l < lib_listing.txt)"
          cat lib_listing.txt | head -50

      - name: Upload lib listing
        uses: actions/upload-artifact@v4
        with:
          name: lib-listing
          path: work/lib_listing.txt
          retention-days: 30
