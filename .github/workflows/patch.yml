name: Patch APK Tokyo Ghoul

on:
  workflow_dispatch:
  # Optional: jalankan otomatis tiap minggu
  # schedule:
  #   - cron: '0 0 * * 0'

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip zipalign apksigner python3-pip
          npm install -g apk-mitm

      # ============================================
      # STEP 1: Download XAPK - coba beberapa metode
      # ============================================
      - name: Download XAPK (Method 1 - wget with User-Agent)
        id: download1
        continue-on-error: true
        run: |
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --referer="https://apkpure.com/" \
            --header="Accept: */*" \
            --header="Accept-Language: en-US,en;q=0.9" \
            -O tokyo_ghoul.xapk \
            "https://d.apkpure.com/b/XAPK/com.tokyoghoulsea1.google?versionCode=10814"
          ls -lh tokyo_ghoul.xapk
          file tokyo_ghoul.xapk

      - name: Download XAPK (Method 2 - apkeep)
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        id: download2
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/download/0.16.0/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          ./apkeep -a com.tokyoghoulsea1.google -d apk-pure ./
          ls -lh *.xapk *.apk 2>/dev/null || true
          # Rename hasil apkeep ke nama standar
          if [ -f "com.tokyoghoulsea1.google.xapk" ]; then
            mv com.tokyoghoulsea1.google.xapk tokyo_ghoul.xapk
          elif [ -f "com.tokyoghoulsea1.google.apk" ]; then
            mv com.tokyoghoulsea1.google.apk tokyo_ghoul.xapk
          fi
          ls -lh tokyo_ghoul.xapk

      - name: Download XAPK (Method 3 - curl with full headers)
        if: steps.download1.outcome == 'failure' && steps.download2.outcome == 'failure'
        id: download3
        run: |
          curl -L -o tokyo_ghoul.xapk \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Referer: https://apkpure.com/tokyo-ghoul-awakening/com.tokyoghoulsea1.google" \
            -H "Accept: */*" \
            "https://d.apkpure.com/b/XAPK/com.tokyoghoulsea1.google?versionCode=10814"
          ls -lh tokyo_ghoul.xapk
          file tokyo_ghoul.xapk

      - name: Verify downloaded file
        run: |
          if [ ! -f tokyo_ghoul.xapk ]; then
            echo "❌ File tidak berhasil diunduh!"
            exit 1
          fi
          SIZE=$(stat -c%s tokyo_ghoul.xapk)
          echo "Ukuran file: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ File terlalu kecil, kemungkinan download gagal"
            head -c 500 tokyo_ghoul.xapk
            exit 1
          fi

      # ============================================
      # STEP 2: Ekstrak XAPK / Deteksi tipe file
      # ============================================
      - name: Extract XAPK
        run: |
          mkdir -p xapk_extracted
          # Cek apakah file ZIP (XAPK itu ZIP)
          if unzip -l tokyo_ghoul.xapk > /dev/null 2>&1; then
            unzip -o tokyo_ghoul.xapk -d xapk_extracted
            echo "=== Isi XAPK ==="
            ls -lh xapk_extracted/
            echo "=== Mencari file APK ==="
            find xapk_extracted -name "*.apk" -type f -exec ls -lh {} \;
          else
            # Bukan ZIP, mungkin langsung APK
            echo "File bukan XAPK, menganggap sebagai APK tunggal"
            cp tokyo_ghoul.xapk xapk_extracted/base.apk
          fi

      # ============================================
      # STEP 3: Patch APK dengan apk-mitm
      # ============================================
      - name: Find and patch main APK
        id: patch
        run: |
          # Cari APK terbesar (biasanya APK utama)
          MAIN_APK=$(find xapk_extracted -name "*.apk" -type f -exec ls -S {} \; | head -1)
          echo "Main APK: $MAIN_APK"
          cp "$MAIN_APK" base.apk
          ls -lh base.apk

          echo "=== Menjalankan apk-mitm ==="
          apk-mitm base.apk || apk-mitm base.apk --wait || true

          echo "=== Hasil patch ==="
          ls -lh *.apk

          # apk-mitm biasanya menghasilkan base-patched.apk
          if [ -f "base-patched.apk" ]; then
            echo "✅ Patch berhasil"
            echo "patched_file=base-patched.apk" >> $GITHUB_OUTPUT
          else
            echo "❌ base-patched.apk tidak ditemukan"
            ls -lh
            exit 1
          fi

      # ============================================
      # STEP 4: Fallback dengan apk-patcher jika gagal
      # ============================================
      - name: Fallback - apk-patcher
        if: failure()
        continue-on-error: true
        run: |
          git clone https://github.com/evilsocket/apk-patcher.git
          cd apk-patcher
          pip install -r requirements.txt || true
          python3 patch.py --apk ../base.apk --ssl-bypass --sign || true
          ls -lh ../*.apk

      # ============================================
      # STEP 5: Repack XAPK dengan APK yang sudah dipatch
      # ============================================
      - name: Repack as XAPK
        run: |
          PATCHED="base-patched.apk"
          if [ ! -f "$PATCHED" ]; then
            # Cari APK hasil patch alternatif
            PATCHED=$(find . -maxdepth 2 -name "*-patched.apk" -o -name "*-signed.apk" | head -1)
          fi

          if [ -z "$PATCHED" ] || [ ! -f "$PATCHED" ]; then
            echo "⚠️ Tidak ada file APK hasil patch, hanya upload APK original yang sudah dipatch sebagian"
            cp base.apk patched_output.apk 2>/dev/null || true
          else
            echo "Menggunakan $PATCHED"

            # Ganti APK asli dengan yang dipatch di dalam struktur XAPK
            MAIN_APK=$(find xapk_extracted -name "*.apk" -type f -exec ls -S {} \; | head -1)
            if [ -n "$MAIN_APK" ]; then
              rm "$MAIN_APK"
              cp "$PATCHED" "$MAIN_APK"
            fi

            # Buat ulang XAPK
            cd xapk_extracted
            zip -r ../tokyo_ghoul_patched.xapk . -x "*.DS_Store"
            cd ..

            # Salin juga APK tunggal
            cp "$PATCHED" patched_output.apk
          fi

          echo "=== File output ==="
          ls -lh tokyo_ghoul_patched.xapk patched_output.apk 2>/dev/null || true

      # ============================================
      # STEP 6: Upload artifacts
      # ============================================
      - name: Upload patched files
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-ghoul-patched
          path: |
            patched_output.apk
            tokyo_ghoul_patched.xapk
            *.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Show summary
        if: always()
        run: |
          echo "=== SUMMARY ==="
          echo "Status workflow: ${{ job.status }}"
          echo ""
          echo "=== File yang tersedia ==="
          ls -lh *.apk *.xapk 2>/dev/null || echo "Tidak ada file output"
          echo ""
          echo "Silakan unduh artifact 'tokyo-ghoul-patched' dari halaman ini"
