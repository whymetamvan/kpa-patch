name: Patch APK Tokyo Ghoul

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip zipalign apksigner
          npm install -g apk-mitm

      - name: Download XAPK
        run: |
          wget -O tokyo_ghoul.xapk "https://d.apkpure.com/b/XAPK/com.tokyoghoulsea1.google?versionCode=10814"
          ls -lh tokyo_ghoul.xapk
          file tokyo_ghoul.xapk

      - name: Unzip XAPK
        run: |
          mkdir xapk_extracted
          unzip -o tokyo_ghoul.xapk -d xapk_extracted
          ls -lh xapk_extracted/

      - name: Find and patch the main APK
        run: |
          # Cari file APK utama (biasanya yang terbesar atau namanya sesuai package)
          MAIN_APK=$(find xapk_extracted -name "*.apk" -type f | head -1)
          echo "Main APK: $MAIN_APK"
          cp "$MAIN_APK" base.apk
          apk-mitm base.apk --wait || apk-mitm base.apk
          ls -lh *.apk

      - name: Repack as XAPK
        run: |
          # Ganti APK asli dengan yang sudah dipatch di dalam struktur XAPK
          MAIN_APK=$(find xapk_extracted -name "*.apk" -type f | head -1)
          rm "$MAIN_APK"
          cp base-patched.apk "$MAIN_APK"
          cd xapk_extracted && zip -r ../tokyo_ghoul_patched.xapk . && cd ..
          ls -lh tokyo_ghoul_patched.xapk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-ghoul-patched
          path: |
            base-patched.apk
            tokyo_ghoul_patched.xapk
          retention-days: 30
