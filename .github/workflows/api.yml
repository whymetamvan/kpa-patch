name: Deep Scan Binary and Native Libraries for APIs

on:
  workflow_dispatch:

jobs:
  deep-scan-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK using cURL
        run: |
          curl "https://dw.uptodown.net/dwn/j_N6FMAzG6kPZEfp8nlNNRJplfDvIBz-msgrx2NrUiJZO5_-BYElqccZLwpwJLKkCv9Vm08egj4P7bHxgftja8ZuhxJ__ScQ_6Z7J7dX8dYRxNZ5orZMeeXVzZs_9IrD/zPmmqkeusEQTNxF_-wpNBqit16FxDoV1-ERXdop2NjIQPBeCy73MTxD38tgzGY2TgfUo3uSDrCnLxh33DThx-UQvf05kII9iu4kO4Xick7IYXnb_vxdoK5S6xYBum8Fg/A0MT9uMEpmxsXij7XQqXTdm7c37hYGcOe4pTE9sMwAvLE7kkp60Z1C2Z0SSfdzEWJjhBasfWF3uBZYyXMnq_6atS6zfiCZLQq24N4BtJHIQ=/free-fire-1-132-1.apk" \
            -H "accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7" \
            -H "accept-language: en-US,en;q=0.9" \
            -H "dnt: 1" \
            -H "priority: u=0, i" \
            -H "referer: https://free-fire-battlegrounds.id.uptodown.com/" \
            -H 'sec-ch-ua: "Chromium";v="154", "Google Chrome";v="154", "Not A(Brand";v="99"' \
            -H "sec-ch-ua-mobile: ?0" \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "sec-fetch-dest: document" \
            -H "sec-fetch-mode: navigate" \
            -H "sec-fetch-site: cross-site" \
            -H "sec-fetch-user: ?1" \
            -H "upgrade-insecure-requests: 1" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36" \
            -o "free-fire-1-132-1.apk"

      - name: Install Analysis Tools (Unzip & Ripgrep)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep unzip

      - name: Extract APK and Deep Scan Binaries
        run: |
          echo "Ekstraksi mentah APK (Zip)..."
          unzip -q free-fire-1-132-1.apk -d extracted_apk

          mkdir -p api_report
          REPORT_FILE="api_report/deep_binary_scan.txt"

          echo "==================================================" > $REPORT_FILE
          echo "1. PENCARIAN DOMAIN & URL GARENA / CONNECT / OAUTH" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          # Mencari string domain garena, connect, oauth, dan register di seluruh binary (DEX, .so, assets)
          strings free-fire-1-132-1.apk | grep -iE "garena|connect|oauth|register" | sort -u >> $REPORT_FILE || echo "Tidak ditemukan" >> $REPORT_FILE

          echo -e "\n==================================================" >> $REPORT_FILE
          echo "2. PENCARIAN SPESIFIK URL DENGAN SKEMA HTTP/HTTPS DI FILE NATIVE (.SO)" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          # Memindai seluruh library C++ (.so) yang diekstrak
          find extracted_apk/lib/ -name "*.so" -exec strings {} + | grep -iE "https?://" | sort -u >> $REPORT_FILE || echo "Tidak ada URL di file .so" >> $REPORT_FILE

          echo -e "\n==================================================" >> $REPORT_FILE
          echo "3. FITUR & ENDPOINT LOGIN / GUEST / AUTH" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          strings free-fire-1-132-1.apk | grep -iE "/oauth/|/guest/|/login/" | sort -u >> $REPORT_FILE || echo "Tidak ditemukan" >> $REPORT_FILE

      - name: Commit and Push Deep Scan Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add api_report/
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada laporan deep scan."
          else
            git commit -m "Add deep binary scan for Garena OAuth & SDK endpoints"
            git push
          fi
