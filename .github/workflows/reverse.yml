name: Extract API Endpoints and Parameters

on:
  workflow_dispatch:

jobs:
  analyze-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK using cURL
        run: |
          curl "https://dw.uptodown.net/dwn/j_N6FMAzG6kPZEfp8nlNNRJplfDvIBz-msgrx2NrUiJZO5_-BYElqccZLwpwJLKkCv9Vm08egj4P7bHxgftja8ZuhxJ__ScQ_6Z7J7dX8dYRxNZ5orZMeeXVzZs_9IrD/zPmmqkeusEQTNxF_-wpNBqit16FxDoV1-ERXdop2NjIQPBeCy73MTxD38tgzGY2TgfUo3uSDrCnLxh33DThx-UQvf05kII9iu4kO4Xick7IYXnb_vxdoK5S6xYBum8Fg/A0MT9uMEpmxsXij7XQqXTdm7c37hYGcOe4pTE9sMwAvLE7kkp60Z1C2Z0SSfdzEWJjhBasfWF3uBZYyXMnq_6atS6zfiCZLQq24N4BtJHIQ=/free-fire-1-132-1.apk" \
            -H "accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7" \
            -H "accept-language: en-US,en;q=0.9" \
            -H "dnt: 1" \
            -H "priority: u=0, i" \
            -H "referer: https://free-fire-battlegrounds.id.uptodown.com/" \
            -H 'sec-ch-ua: "Chromium";v="154", "Google Chrome";v="154", "Not A(Brand";v="99"' \
            -H "sec-ch-ua-mobile: ?0" \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "sec-fetch-dest: document" \
            -H "sec-fetch-mode: navigate" \
            -H "sec-fetch-site: cross-site" \
            -H "sec-fetch-user: ?1" \
            -H "upgrade-insecure-requests: 1" \
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36" \
            -o "free-fire-1-132-1.apk"

      - name: Install Analysis Tools (JADX & Ripgrep)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep openjdk-17-jre-headless
          JADX_VERSION="1.5.0"
          curl -L -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q jadx.zip -d jadx_bin
          echo "$PWD/jadx_bin/bin" >> $GITHUB_PATH

      - name: Decompile and Extract API Information
        run: |
          echo "Mendekompilasi APK..."
          jadx -d decompiled_src free-fire-1-132-1.apk || true

          # Buat folder laporan
          mkdir -p api_report

          REPORT_FILE="api_report/api_analysis_report.txt"

          echo "==================================================" > $REPORT_FILE
          echo "1. DAFTAR URL ENDPOINT API (HTTP / HTTPS)" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          # Mencari semua string yang diawali http:// atau https://
          rg -o -i 'https?://[a-zA-Z0-9./_~%-]+' decompiled_src/ | sort -u >> $REPORT_FILE || echo "Tidak ada URL ditemukan" >> $REPORT_FILE

          echo -e "\n==================================================" >> $REPORT_FILE
          echo "2. DEKLARASI ANOTASI RETROFIT (@POST, @GET, @Url)" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          # Mencari anotasi API Retrofit
          rg -i '@(POST|GET|PUT|DELETE|Headers|Url)' decompiled_src/ >> $REPORT_FILE || echo "Tidak ada Retrofit interface ditemukan" >> $REPORT_FILE

          echo -e "\n==================================================" >> $REPORT_FILE
          echo "3. STRUKTUR PESAN PROTOBUF TERKAIT LOGIN / REQ" >> $REPORT_FILE
          echo "==================================================" >> $REPORT_FILE
          # Mencari definisi message Protobuf di file .proto
          rg -i 'message .*Req' decompiled_src/ >> $REPORT_FILE || echo "Tidak ada message Protobuf ditemukan" >> $REPORT_FILE

      - name: Commit and Push Report to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add api_report/
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan laporan."
          else
            git commit -m "Add API endpoints and parameters analysis report"
            git push
          fi
